[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-market-generator"
version = "0.1.0"
description = "Empirically calibrated synthetic market data engine"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "hmmlearn",
    "arch",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "jupyter", "yfinance"]
api = ["fastapi", "uvicorn[standard]", "httpx"]  # httpx: TestClient

[tool.setuptools.packages.find]
include = ["synthetic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # hmmlearn on numpy>=2.5: `arr.shape = ...` deprecation, triggered inside the
    # dependency on every fit — benign, one category, ~all of the warning volume
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
